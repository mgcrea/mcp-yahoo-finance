name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly, for the live job: Yahoo changes what it accepts without notice.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on node@${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["lts/*"]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Lint 🔍
        run: pnpm run lint
      - name: Format 🔍
        run: pnpm run format:check
      - name: TypeScript 🔍
        run: pnpm run typecheck
      - name: Test 🧪
        run: pnpm run test
      - name: Build 📦
        run: pnpm run build
      # Every client config in the wild spells this server `npx -y <package>`,
      # and npx picks the bin by name: it only forgives a mismatch while the
      # package ships exactly one. So the day a second bin is added, that
      # command starts failing with "could not determine executable to run" —
      # at the client, with stderr swallowed, long after CI was green. Mirrors
      # npm's own getBinFromManifest, so it fails here first instead.
      - name: npx can resolve a bin 🔒
        run: |
          node -e "
            const pkg = require('./package.json');
            const bin = pkg.bin ?? {};
            const unscoped = pkg.name.slice(pkg.name.indexOf('/') + 1);
            if (new Set(Object.values(bin)).size > 1 && !bin[unscoped]) {
              console.error('npx cannot pick a bin for ' + pkg.name + ': none of [' +
                Object.keys(bin).join(', ') + '] is named ' + unscoped + '.');
              console.error('Add a ' + unscoped + ' alias pointing at the server entry point.');
              process.exit(1);
            }
          "
      - name: Package is publishable 🔍
        run: |
          node -e '
            const pkg = require("./package.json");
            if (pkg.private) {
              console.error("package.json has \"private\": true — npm publish and the release job will both refuse it.");
              process.exit(1);
            }
            if (!pkg.publishConfig || pkg.publishConfig.access !== "public") {
              console.error("a scoped package needs publishConfig.access = \"public\".");
              process.exit(1);
            }
            console.log(`publishable: ${pkg.name}@${pkg.version}`);
          '

      # The tool list is the server's public contract and is easy to change by
      # accident. Run with NO credentials: the server must still speak MCP over
      # stdio and answer tools/list. A server that exits here shows in the client
      # as a bare "Connection closed" with stderr swallowed, so nothing explains
      # what to configure.
      - name: MCP smoke test 🧪
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | env  HOME=/nonexistent node dist/cli.js 2>/dev/null > /tmp/tools.json
          grep -q 'yahoo_get_option_chain' /tmp/tools.json \
            || { echo "server did not answer tools/list without credentials"; exit 1; }

  # The one check that talks to Yahoo. Every other test runs against a mocked
  # fetch, so none of them can see the failure that actually happens: Yahoo
  # answering 429 to a TLS handshake it no longer accepts (src/client/transport.ts).
  # Deliberately not a dependency of publish-npm — Yahoo changing its mind must
  # not block an unrelated release — but red here means the published server
  # is broken for everyone.
  live:
    name: Live against Yahoo
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Build 📦
        run: pnpm run build
      - name: Call Yahoo through the server 🌐
        run: |
          {
            printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"yahoo_get_historical_stock_prices","arguments":{"ticker":"AAPL","period":"5d","interval":"1d"}}}' \
              '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"yahoo_get_stock_info","arguments":{"ticker":"AAPL"}}}'
            sleep 20
          } | YAHOO_FINANCE_DEBUG=1 node dist/cli.js > /tmp/live.json
          node -e '
            const lines = require("fs").readFileSync("/tmp/live.json", "utf8").split("\n").filter(Boolean).map(JSON.parse);
            let failed = false;
            for (const id of [2, 3]) {
              const r = lines.find((l) => l.id === id)?.result;
              const text = r?.content?.[0]?.text ?? "<no response>";
              const bad = !r || r.isError;
              console.log(`${id}: ${bad ? "FAIL" : "ok"} ${text.slice(0, 160)}`);
              failed ||= bad;
            }
            process.exit(failed ? 1 : 0);
          '

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    # id-token: write is required for OIDC trusted publishing + provenance
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"
          registry-url: https://registry.npmjs.org
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Upgrade npm 🔧
        # OIDC trusted publishing needs a recent npm CLI
        run: npm install -g npm@latest
      # A version already on npm cannot be republished, so re-running this job — after
      # re-pushing a tag, or a manual re-run — would fail on a duplicate. Skip instead,
      # so the tag is the source of truth and pushing one is always safe.
      - name: Check npm for this version 🔍
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already published — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish 🚀
        if: steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Create release 🏷️
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true

  docker:
    name: Docker (build & push)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # id-token: write is required for cosign keyless signing
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Git metadata 🏷️
        id: git
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU 🧰
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx 🧰
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR 🔐
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata 🏷️
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=short

      - name: Build & push 🚢
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ steps.git.outputs.commit }}
            GIT_COMMIT_DATE=${{ steps.git.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup cosign 🔏
        uses: sigstore/cosign-installer@v3

      - name: Sign image 🔏
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
