name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on node@${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["lts/*"]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Lint 🔍
        run: pnpm run lint
      - name: Format 🔍
        run: pnpm run format:check
      - name: TypeScript 🔍
        run: pnpm run typecheck
      - name: Test 🧪
        run: pnpm run test
      - name: Build 📦
        run: pnpm run build
      # Every client config in the wild spells this server `npx -y <package>`,
      # and npx picks the bin by name: it only forgives a mismatch while the
      # package ships exactly one. So the day a second bin is added, that
      # command starts failing with "could not determine executable to run" —
      # at the client, with stderr swallowed, long after CI was green. Mirrors
      # npm's own getBinFromManifest, so it fails here first instead.
      - name: npx can resolve a bin 🔒
        run: |
          node -e "
            const pkg = require('./package.json');
            const bin = pkg.bin ?? {};
            const unscoped = pkg.name.slice(pkg.name.indexOf('/') + 1);
            if (new Set(Object.values(bin)).size > 1 && !bin[unscoped]) {
              console.error('npx cannot pick a bin for ' + pkg.name + ': none of [' +
                Object.keys(bin).join(', ') + '] is named ' + unscoped + '.');
              console.error('Add a ' + unscoped + ' alias pointing at the server entry point.');
              process.exit(1);
            }
          "
      # The tool list is the server's public contract and is easy to change by
      # accident. Run with NO credentials: the server must still speak MCP over
      # stdio and answer tools/list. A server that exits here shows in the client
      # as a bare "Connection closed" with stderr swallowed, so nothing explains
      # what to configure.
      - name: MCP smoke test 🧪
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | env  HOME=/nonexistent node dist/cli.js 2>/dev/null > /tmp/tools.json
          grep -q 'yahoo_' /tmp/tools.json \
            || { echo "server did not answer tools/list without credentials"; exit 1; }

  docker:
    name: Docker (build & push)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Git metadata 🏷️
        id: git
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU 🧰
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx 🧰
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR 🔐
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata 🏷️
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=short

      - name: Build & push 🚢
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ steps.git.outputs.commit }}
            GIT_COMMIT_DATE=${{ steps.git.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
